services:

  mysql-primary:
    image: mysql:8.0
    container_name: mycab-mysql-primary
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mycab
      MYSQL_USER: mycab_user
      MYSQL_PASSWORD: mycab_password
    ports:
      - "3307:3306"
    volumes:
      - mycab_mysql_primary_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mycab-network

  mysql-backup:
    image: mysql:8.0
    container_name: mycab-mysql-backup
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mycab
      MYSQL_USER: mycab_user
      MYSQL_PASSWORD: mycab_password
    ports:
      - "3308:3306"
    volumes:
      - mycab_mysql_backup_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mycab-network

  server1:
    build:
      context: .
      dockerfile: Dockerfile.server
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-backup:
        condition: service_healthy
    environment:
      DB_PRIMARY_HOST: mysql-primary
      DB_PRIMARY_PORT: "3306"
      DB_BACKUP_HOST: mysql-backup
      DB_BACKUP_PORT: "3306"
      SERVER_HOSTNAME: server1
    container_name: mycab-server1
    networks:
      - mycab-network

  server2:
    build:
      context: .
      dockerfile: Dockerfile.server
    depends_on:
      mysql-primary:
        condition: service_healthy
      mysql-backup:
        condition: service_healthy
    environment:
      DB_PRIMARY_HOST: mysql-primary
      DB_PRIMARY_PORT: "3306"
      DB_BACKUP_HOST: mysql-backup
      DB_BACKUP_PORT: "3306"
      SERVER_HOSTNAME: server2
    container_name: mycab-server2
    networks:
      - mycab-network

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: mycab-client
    command: ["java", "-cp", "out", "client.myCabClient", "server1:1099"]
    depends_on:
      - server1
      - server2
    stdin_open: true
    tty: true
    networks:
      - mycab-network

networks:

  mycab-network:
    driver: bridge

volumes:

  mycab_mysql_primary_data:
  mycab_mysql_backup_data: